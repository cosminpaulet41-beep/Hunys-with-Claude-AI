name: Penumbra APK

on:
  push:
    branches: [main]
    paths:
      - 'penumbra/**'
      - '.github/workflows/penumbra-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Aceleași unelte ca în build.sh: aapt2 (din Apktool), dx (din dex2jar), uber-apk-signer.
      # Same tools as build.sh: aapt2 (from Apktool), dx (from dex2jar), uber-apk-signer.
      - name: Get the build tools
        run: |
          mkdir -p "$HOME/tools" && cd "$HOME/tools"
          curl -sSfL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          unzip -q -j apktool.jar prebuilt/linux/aapt2_64 -d . && chmod +x aapt2_64
          curl -sSfL -o dex-tools.zip https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip
          unzip -q -j dex-tools.zip dex-tools-v2.4/lib/dx-30.0.2.jar -d .
          curl -sSfL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          if [ ! -f "$JAR" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null
          fi
          echo "ANDROID_JAR=$JAR" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: penumbra
        run: |
          AAPT2="$HOME/tools/aapt2_64" DX_JAR="$HOME/tools/dx-30.0.2.jar" SIGNER_JAR="$HOME/tools/uber-apk-signer.jar" ./build.sh
          VERSION=$(grep -m1 '^VERSION_NAME=' build.sh | cut -d= -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Name the files
        run: |
          cp "penumbra/build/Penumbra-v$VERSION.apk" "Penumbra-v$VERSION.apk"
          # Bluetooth-ul de pe Android refuză .apk, dar acceptă .zip / Android's Bluetooth refuses .apk but accepts .zip.
          zip -j "Penumbra-v$VERSION-bluetooth.zip" "Penumbra-v$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Penumbra-apk
          path: Penumbra-v${{ env.VERSION }}.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: penumbra-build-${{ github.run_number }}
          name: Penumbra v${{ env.VERSION }} · build ${{ github.run_number }}
          make_latest: false
          files: |
            Penumbra-v${{ env.VERSION }}.apk
            Penumbra-v${{ env.VERSION }}-bluetooth.zip
          body: |
            **RO:** Penumbra întunecă ecranul mai mult decât luminozitatea minimă, cu filtru cald, lumină de fundal minimă, notificare cu butoane și buton rapid. Descarcă `Penumbra-v${{ env.VERSION }}.apk` de mai jos și deschide-l pe telefon ca să-l instalezi (permite instalarea din surse necunoscute dacă îți cere). La prima pornire, dă-i permisiunea „Afișare peste alte aplicații”. Versiunile noi se instalează peste cea veche.
            Ca să-l trimiți altui telefon prin Bluetooth, trimite `Penumbra-v${{ env.VERSION }}-bluetooth.zip` (Bluetooth-ul de pe Android nu acceptă fișiere .apk), apoi extrage-l pe celălalt telefon și apasă pe APK.

            **EN:** Penumbra dims the screen below minimum brightness, with a warm filter, minimum backlight, notification buttons and a Quick Settings tile. Download `Penumbra-v${{ env.VERSION }}.apk` below and open it on your phone to install (allow installs from unknown sources if asked). On first start, grant "Display over other apps". New versions install over the old one.
            To send it to another phone by Bluetooth, send `Penumbra-v${{ env.VERSION }}-bluetooth.zip` (Android's Bluetooth won't accept .apk files), then extract it on the other phone and tap the APK.
