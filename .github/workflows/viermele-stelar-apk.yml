name: Viermele Stelar APK

on:
  push:
    branches: [main]
    paths:
      - 'viermele-stelar/**'
      - '.github/workflows/viermele-stelar-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        working-directory: viermele-stelar/android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp viermele-stelar/android/app/build/outputs/apk/release/app-release.apk ViermeleStelar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ViermeleStelar-apk
          path: ViermeleStelar.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: viermele-stelar-build-${{ github.run_number }}
          name: Viermele Stelar · build ${{ github.run_number }}
          make_latest: true
          files: ViermeleStelar.apk
          body: |
            **RO:** Descarcă `ViermeleStelar.apk` de mai jos și deschide-l pe telefon ca să-l instalezi (permite instalarea din surse necunoscute dacă îți cere). Versiunile noi se instalează peste cea veche, fără să pierzi progresul.

            **EN:** Download `ViermeleStelar.apk` below and open it on your phone to install (allow installs from unknown sources if asked). New versions install over the old one and keep your progress.
