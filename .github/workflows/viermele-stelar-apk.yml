name: Viermele Stelar APK

on:
  push:
    branches: [main]
    paths:
      - 'viermele-stelar/**'
      - '.github/workflows/viermele-stelar-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        working-directory: viermele-stelar/android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp viermele-stelar/android/app/build/outputs/apk/release/app-release.apk ViermeleStelar.apk

      # Android's Bluetooth refuses .apk files but accepts .zip, so ship a zipped copy for sending by Bluetooth.
      - name: Zip a copy for Bluetooth
        run: zip -j ViermeleStelar-bluetooth.zip ViermeleStelar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ViermeleStelar-apk
          path: ViermeleStelar.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: viermele-stelar-build-${{ github.run_number }}
          name: Viermele Stelar · build ${{ github.run_number }}
          make_latest: true
          files: |
            ViermeleStelar.apk
            ViermeleStelar-bluetooth.zip
          body: |
            **RO:** Descarcă `ViermeleStelar.apk` de mai jos și deschide-l pe telefon ca să-l instalezi (permite instalarea din surse necunoscute dacă îți cere). Versiunile noi se instalează peste cea veche, fără să pierzi progresul.
            Ca să-l trimiți altui telefon prin Bluetooth, trimite `ViermeleStelar-bluetooth.zip` (Bluetooth-ul de pe Android nu acceptă fișiere .apk). Pe celălalt telefon deschide arhiva din aplicația Fișiere, extrage-o și apasă pe APK.

            **EN:** Download `ViermeleStelar.apk` below and open it on your phone to install (allow installs from unknown sources if asked). New versions install over the old one and keep your progress.
            To send it to another phone by Bluetooth, send `ViermeleStelar-bluetooth.zip` instead (Android's Bluetooth won't accept .apk files). On the other phone, open the zip in the Files app, extract it and tap the APK.
