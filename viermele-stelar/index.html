/* Layout: full-screen arena canvas; HUD hugs the top edge in one compact band, controls sit in the thumb zone; menus are phone-width cards over the live arena */
:root{
  --deep:#0A0F1F; --bg:#0B1124; --panel:rgba(16,22,44,.86); --solid:#10162C; --inset:#0B1124;
  --line:#2A3560; --line2:#222B4E; --text:#EEF2FF; --muted:#A3AED0; --mint:#6EF2B0; --mint-ink:#062014;
  --amber:#FFC857; --coral:#FF8A96; --red:#FF6B7A; --violet:#9C84FF; --sky:#6FC8FF;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--deep);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--deep)}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.12em;line-height:1.4;color:var(--muted);text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.num{font-variant-numeric:tabular-nums}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud button{pointer-events:auto}
.hud-top{position:absolute;left:calc(8px + var(--sl));right:calc(8px + var(--sr));top:calc(8px + var(--st));display:flex;align-items:flex-start;gap:6px}
.hud-left{flex:none;width:120px;display:flex;flex-direction:column;gap:6px}
.lenbox{padding:5px 10px 6px}
.lenrow{display:flex;align-items:baseline;gap:4px;line-height:1.2}
#lenVal{font-size:20px;font-weight:700}
#lenDelta{font-size:11px;font-weight:700;color:var(--mint)}
#rankVal{font-size:10px;font-weight:500;line-height:1.4;color:var(--muted);display:flex;align-items:center;gap:3px}
#rankVal.lead{color:var(--amber);font-weight:700}
#mini{width:120px;height:120px;display:block}
.grow{flex:1 1 auto}
.board{flex:none;width:170px;padding:5px 9px 6px;font-size:11px;font-weight:500}
.brow{display:flex;align-items:center;gap:6px;height:15px;white-space:nowrap}
.brow .rk{width:12px;color:var(--muted)}
.brow .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px}
.brow .sc{font-weight:700}
.brow.me{height:17px;margin:1px -5px 0;padding:0 5px;border-radius:6px;background:rgba(110,242,176,.14);color:var(--mint)}
.brow.me .rk{color:var(--mint)}
.iconbtn{flex:none;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center}
#notices{position:absolute;left:calc(136px + var(--sl));right:calc(8px + var(--sr));top:calc(110px + var(--st));display:flex;flex-direction:column;align-items:center;gap:6px}
.notice{display:flex;align-items:center;gap:7px;background:rgba(16,22,44,.92);border:1px solid var(--line);font-size:11px;font-weight:500;animation:pop .25s ease-out;max-width:100%}
.notice.pill{height:24px;padding:0 10px;border-radius:999px}
.notice.gold{border-color:#5A4A1E}
.notice.card{padding:5px 12px 5px 6px;border-radius:12px;border-color:#3A4472}
.notice .t{font-weight:700;line-height:1.3}
.notice .d{font-size:10px;font-weight:400;color:var(--muted);line-height:1.3}
.notice.out{opacity:0;transform:translateY(-4px);transition:.3s}
.hl{color:var(--amber);font-weight:700}
#combo{position:absolute;left:calc(136px + var(--sl));right:calc(8px + var(--sr));top:calc(196px + var(--st));display:flex;flex-direction:column;align-items:center;gap:1px}
#comboVal{font-size:18px;font-weight:700;line-height:1;color:var(--amber)}
#combo .lbl{font-size:8px;letter-spacing:.24em;color:var(--text)}
#combo .bar{width:48px;height:3px;margin-top:2px;border-radius:2px;background:rgba(238,242,255,.15);overflow:hidden}
#comboBar{height:3px;background:var(--amber);width:100%}
#bite{position:absolute;left:0;right:0;top:38%;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.8)}
#biteT{font-size:18px;font-weight:700;color:var(--amber);line-height:1.3}
#biteD{font-size:12px;font-weight:500;line-height:1.3}
#bite.show{animation:pop .3s ease-out}
#joy{position:absolute;left:calc(16px + var(--sl));bottom:calc(24px + var(--sb));width:112px;height:112px;box-sizing:border-box;border-radius:50%;border:2px solid rgba(238,242,255,.18);background:rgba(238,242,255,.04)}
#joy.float{transform:translate(-50%,50%);transition:none}
#knob{position:absolute;left:31px;top:31px;width:46px;height:46px;border-radius:50%;background:rgba(238,242,255,.8);box-shadow:0 4px 12px rgba(0,0,0,.4)}
#chips{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + var(--sb));width:132px;display:flex;flex-direction:column;gap:5px}
.chip{display:flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:8px;background:rgba(16,22,44,.88);border:1px solid var(--line);font-size:10px;font-weight:500}
.chip span:nth-child(2){flex:1 1 auto}
.chip .v{color:var(--muted)}
#boostBtn{position:absolute;right:calc(20px + var(--sr));bottom:calc(36px + var(--sb));width:68px;height:68px;padding:0;border-radius:50%;border:3px solid var(--mint);background:rgba(16,22,44,.88);display:flex;align-items:center;justify-content:center;touch-action:none}
#boostBtn.on{background:var(--mint)}
#boostBtn.on path{fill:var(--mint-ink)}
#boostBtn.off{border-color:var(--line)}
#boostBtn.off path{fill:#5B6690}
.chip.warn{border-color:#5A4A1E;color:var(--amber)}
#notices .notice.card{min-height:0;flex-direction:row;gap:7px;background:rgba(16,22,44,.92);box-sizing:border-box}
#notices .notice svg{flex:none}
#fireBtn{position:absolute;right:calc(26px + var(--sr));bottom:calc(118px + var(--sb));width:56px;height:56px;padding:0;border-radius:50%;border:3px solid var(--amber);background:rgba(16,22,44,.9);display:flex;align-items:center;justify-content:center;touch-action:none}
#fireBtn:active{transform:scale(.92)}
#fireIcon{display:flex}
#fireBtn.off{opacity:.45}
#fireBtn.fresh{animation:firepulse 1s ease-in-out 3}
#fireAmmo{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;box-sizing:border-box;padding:0 5px;border-radius:999px;background:var(--text);color:var(--deep);font-size:11px;font-weight:700;line-height:20px;text-align:center}
@keyframes firepulse{50%{box-shadow:0 0 0 8px rgba(255,200,87,.25)}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;background:rgba(10,15,31,.9);-webkit-overflow-scrolling:touch}
.col{box-sizing:border-box;max-width:420px;min-height:100%;margin:0 auto;padding:calc(20px + var(--st)) max(20px, calc(16px + var(--sr))) calc(22px + var(--sb)) max(20px, calc(16px + var(--sl)));display:flex;flex-direction:column}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dust{display:flex;align-items:center;gap:8px;height:44px;box-sizing:border-box;padding:0 16px 0 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:15px}
.seg{display:flex;padding:3px;gap:2px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.seg button{height:36px;min-width:48px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--mint);color:var(--mint-ink);font-weight:700}
.hero{display:block;width:100%;height:auto;max-height:236px;margin-top:4px}
h1.title{margin:2px 0 0;text-align:center;font-weight:700;font-size:42px;line-height:1.05;letter-spacing:.5px;text-wrap:balance}
h1.title span{color:var(--mint)}
.sub{margin:8px 0 0;text-align:center;font-size:15px;font-weight:500;color:var(--muted)}
.spacer{flex:1 1 auto;min-height:16px}
.form{display:flex;flex-direction:column;gap:8px}
.flbl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.input{height:50px;box-sizing:border-box;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--solid);color:var(--text);font-family:inherit;font-size:16px;font-weight:500;width:100%}
.input::placeholder{color:#7F8AB0}
.input{user-select:text;-webkit-user-select:text}
.lenbox{overflow:hidden;white-space:nowrap}
.speeds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.speeds button{height:54px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--solid);color:var(--text);font-weight:500;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.speeds button svg{stroke:var(--muted)}
.speeds button.x{color:var(--coral)}
.speeds button.x svg{stroke:var(--coral)}
.speeds button[aria-checked="true"]{border:2px solid var(--mint);background:rgba(110,242,176,.12);color:var(--mint);font-weight:700}
.speeds button[aria-checked="true"] svg{stroke:var(--mint)}
.btn{height:50px;border:1px solid var(--line);border-radius:14px;background:var(--solid);color:var(--text);font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{height:58px;border:0;border-radius:18px;background:var(--mint);color:var(--mint-ink);font-weight:700;font-size:20px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:12px;font-weight:500;color:var(--muted)}
.foot strong{color:var(--amber);font-weight:700}
.head{display:flex;align-items:center;gap:12px}
.head h2{margin:0;flex:1 1 auto;font-size:22px;font-weight:700}
.back{width:44px;height:44px;padding:0;border-radius:14px;border:1px solid var(--line);background:var(--solid);display:flex;align-items:center;justify-content:center;flex:none}

  if (w.x2T > 0) w.x2T -= dt;
  if (w.magnet2T > 0) w.magnet2T -= dt;
  if (w.fleeT > 0) w.fleeT -= dt;
  if (w.fireCd > 0) w.fireCd -= dt;
  // boosting costs length (an online client gets its length from the host); turbo from a pickup is free
  if (w.boosting && NET.mode !== 'client' && !(w.turboT > 0)) {
    if (w.score <= MIN_BOOST) w.boosting = false;
    else {
      const loss = (3 + w.score * 0.004) * dt * SPEED_MUL[curSpeed()];
      w.score = Math.max(MIN_BOOST, w.score - loss); w.boostAcc += loss;
      if (w.boostAcc >= 1.2) { const tail = w.pts[w.pts.length - 1] || w; addFood(tail.x + rand(-3, 3), tail.y + rand(-3, 3), 3, w.boostAcc * 0.7, w.band, false); w.boostAcc = 0; }
    }
  }
  if (w.magnetT > 0) w.magnetT -= dt;
  if (w.invuln > 0) w.invuln -= dt;
  if (w.score > w.maxScore) w.maxScore = w.score;
}

// Lays the body behind the head as it moves and trims the tail to the worm's length.
function advanceTrail(w) {
  const spacing = spacingOf(w);
  let p0 = w.pts[0];
  if (!p0) { w.pts.push({ x: w.x, y: w.y }); p0 = w.pts[0]; }
  let dx = w.x - p0.x, dy = w.y - p0.y, d = Math.hypot(dx, dy), guard = 0;
  while (d >= spacing && guard++ < 50) { const k = spacing / d; const q = { x: p0.x + dx * k, y: p0.y + dy * k }; w.pts.unshift(q); p0 = q; dx = w.x - p0.x; dy = w.y - p0.y; d = Math.hypot(dx, dy); }
  const n = targetN(w.score);
  while (w.pts.length > n) { const a = w.pts.pop(), b = w.pts[w.pts.length - 1]; if (b) w.trimmed += Math.hypot(a.x - b.x, a.y - b.y); }
}

function grow(w, v) {
  w.score += v;
  if (!w.isPlayer && !w.human) { const cap = diffCfg().maxBot; if (w.score > cap) w.score = cap; }
  if (w.isPlayer) { run.gains.push({ t: run.time, v }); if (run.time - run.lastEat < 1.1) run.combo++; else run.combo = 1; run.lastEat = run.time; if (run.combo > run.maxCombo) run.maxCombo = run.combo; } }

// Magnet pickup: everything from twice as far. A moon's magnet: a quarter farther.
const reachMul = w => (w.magnet2T > 0 ? 2 : w.magnetT > 0 ? 1.25 : 1);
function eat(w, dt) {
  const r = rOf(w), hr = r * 1.3;
  let R = r * 3.2 + 18; R *= reachMul(w);
  const pull = (260 + speedOf(w)) * dt;
  // Easy mode feeds humans faster; the ×2 pickup doubles everything on top.
  const mul = (w.x2T > 0 ? 2 : 1) * (w.isPlayer || w.human ? diffCfg().foodMul : 1);
  foodGrid.each(w.x, w.y, R, f => {
    if (!f.alive) return;
    const dx = w.x - f.x, dy = w.y - f.y, d2 = dx * dx + dy * dy;
    if (d2 > R * R) return;
    const d = Math.sqrt(d2);
    if (d < hr + f.r) { f.alive = false; W.deadFood++; if (f.nat) W.natFood--; grow(w, f.v * mul); return; }
    const s = Math.min(d, pull); f.x += dx / d * s; f.y += dy / d * s;
  });
}

function dropBody(w, keep) {
  const pts = w.pts, total = w.score * (keep ?? 0.7);
  if (!pts.length) return;
  const count = clamp(Math.round(total / 3), 6, 160), step = Math.max(1, Math.floor(pts.length / count));
  const n = Math.ceil(pts.length / step), v = total / n, r = clamp(2.6 + Math.sqrt(v) * 1.1, 3, 8), jr = rOf(w);
  for (let i = 0; i < pts.length; i += step) { const p = pts[i]; addFood(p.x + rand(-jr, jr), p.y + rand(-jr, jr), r, v, Math.random() < 0.5 ? w.band : w.base, false); }
}

function killWorm(w, reason, by, keep) {
  if (!w.alive) return;
  w.alive = false; w.boosting = false;
  W.deaths[reason] = (W.deaths[reason] || 0) + 1;
  dropBody(w, keep);
  if (by && by.alive) by.kills++;
  if (w.isPlayer) {
    run.reason = reason; run.killer = by ? by.name : ''; run.diedAt = performance.now();
    state = 'dead'; vibrate(220);
    setTimeout(showGameOver, 1300);
  } else if (w.remote) {
    tell(w, { e: 'die', r: reason, k: by ? by.name : '' });
  } else {
    W.respawns.push(W.t + rand(2, 5));
  }
}

// Something happened to worm w that its human should hear about (here, or on another phone).
function tell(w, ev) { if (w.isPlayer) showEvent(ev); else if (w.remote) netQueue(w, ev); }
function showEvent(ev) {
  if (ev.e === 'eat') showBite(t('eatT'), t('eatD', { name: esc(ev.n) }));
  else if (ev.e === 'moon') notifyCard('moon', t('moonT'), t('moonD'));
  else if (ev.e === 'planet') notifyCard('planet', t('planetT'), t('planetD'));
  else if (ev.e === 'small') notifyPill(t('tooSmall', { n: ev.n }));
  else if (ev.e === 'shield') notifyPill('<span class="hl">' + t('shieldUsed') + '</span>', 'gold');
  else if (ev.e === 'hole') notifyCard('hole', t('holeT'), t('holeD', { n: fmt(ev.l) }));
  else if (ev.e === 'bite') showBite(t('biteT'), t('biteD', { name: esc(ev.n), n: fmt(ev.l) }));
  else if (ev.e === 'bitten') { showBite(t('bittenT', { name: esc(ev.n) }), t('bittenD', { n: fmt(ev.l) })); vibrate(60); }
  else if (ev.e === 'pk' && PICKUPS[ev.k]) { notifyCard(pkSvg(ev.k, 26), t('pk_' + ev.k + 'T'), t('pk_' + ev.k + 'D')); if (PICKUPS[ev.k].weapon) fireBtn.classList.add('fresh'); }
  else if (ev.e === 'stunned') { showBite(t('stunnedT'), t('stunnedD', { name: esc(ev.n) })); vibrate(160); }
  else if (ev.e === 'pushed') { showBite(t('pushedT'), t('pushedD', { name: esc(ev.n) })); vibrate(80); }
  else if (ev.e === 'hitStun') notifyPill(pkSvg('stun', 13) + '<span>' + t('hitStun', { name: esc(ev.n) }) + '</span>', 'gold');
  else if (ev.e === 'hitRepel') notifyPill(pkSvg('repel', 13) + '<span>' + t('hitRepel', { name: esc(ev.n) }) + '</span>', 'gold');
  else if (ev.e === 'blocked') notifyPill(pkSvg('shield', 13) + '<span>' + t('blocked', { name: esc(ev.n) }) + '</span>');
  else if (ev.e === 'saved') notifyPill(pkSvg('shield', 13) + '<span>' + t('savedBy', { name: esc(ev.n) }) + '</span>');
  else if (ev.e === 'bots') { notices.querySelectorAll('.bots').forEach(e => e.remove()); notifyPill('<span>' + t('botsSet', { n: ev.n, name: esc(ev.by || '?') }) + '</span>', 'bots'); }
  else if (ev.e === 'hitBlocked') notifyPill(pkSvg('shield', 13) + '<span>' + t('hitBlocked', { name: esc(ev.n) }) + '</span>');
}

/* ---------------- Pickups & weapons ---------------- */
// Bots never pick up weapons, and on Easy they leave every pickup for you.
// Bots only grab boosts and double energy, never weapons, shields or ghosts; on Easy they take nothing.
// Pickups glide to a head that comes close: no need to hit their centre.
const pullRange = w => (rOf(w) * 1.3 + PK_R + 45) * (w.magnet2T > 0 ? 2 : 1);
function pullPickups(dt) {
  for (const w of W.worms) {
    if (!w.alive) continue;
    const R = pullRange(w), step = (220 + speedOf(w)) * dt;
    for (const p of W.pickups) {
      if (!p.alive || Math.abs(p.x - w.x) > R || Math.abs(p.y - w.y) > R || !canTake(w, p)) continue;
      const dx = w.x - p.x, dy = w.y - p.y, d = Math.hypot(dx, dy);
      if (d > R || d < 0.01) continue;
      const k = Math.min(d, step) / d; p.x += dx * k; p.y += dy * k; W.pkDirty = true;
    }
  }
}
function canTake(w, p) { if (w.isPlayer || w.human) return true; return diffCfg().botPick && (p.type === 'turbo' || p.type === 'x2'); }
function takePickup(w, p) {
  p.alive = false; p.back = W.t + rand(12, 20); W.pkVer++;
  const k = p.type;
  if (k === 'shield') w.shield = Math.min(3, w.shield + 1);
  else if (PICKUPS[k].weapon) { if (w.weapon === k) w.ammo = Math.min(AMMO_MAX, w.ammo + AMMO_PER); else { w.weapon = k; w.ammo = AMMO_PER; } }
  else if (k === 'turbo') w.turboT = TURBO_TIME;
  else if (k === 'ghost') { w.ghostT = GHOST_TIME; w.invuln = Math.max(w.invuln, GHOST_TIME); }
  else if (k === 'x2') w.x2T = X2_TIME;
  else if (k === 'magnet') w.magnet2T = MAGNET_TIME;
  addFx(p.x, p.y, k, 0.6);
  tell(w, { e: 'pk', k });
}
function addFx(x, y, type, size) {
  const f = { x, y, type, t0: W.t, s: size || 1 }; W.fx.push(f);
  if (NET.mode === 'host') NET.fxOut.push(f);
}
// Auto-aim: a bigger worm close by is a threat from any side (it may be chasing you);
// otherwise the shot goes to the worm closest to where you are heading.
function aimFor(w) {
  let best = null, bestS = 1e9;
  for (const o of W.worms) {
    if (o === w || !o.alive || o.invuln > 0) continue;
    const dx = o.x - w.x, dy = o.y - w.y, d = Math.hypot(dx, dy);
    if (d > 680) continue;
    const da = Math.abs(angDiff(Math.atan2(dy, dx), w.angle)), threat = o.score > w.score && d < 420;
    if (!threat && da > 0.8) continue;
    const s = d * (threat ? 0.5 : 1) + da * 260;
    if (s < bestS) { bestS = s; best = o; }
  }
  return best;
}
function fire(w) {
  if (!w || !w.alive || !w.weapon || w.ammo <= 0 || w.fireCd > 0 || w.stunT > 0) return false;
  const o = aimFor(w); let a = w.angle;
  if (o) { const tt = Math.hypot(o.x - w.x, o.y - w.y) / SHOT_SPEED, sp = o.stunT > 0 ? 0 : speedOf(o); a = Math.atan2(o.y + Math.sin(o.angle) * sp * tt - w.y, o.x + Math.cos(o.angle) * sp * tt - w.x); }
  const hr = rOf(w) * 1.3, cx = Math.cos(a), cy = Math.sin(a);
  W.shots.push({ x: w.x + cx * hr, y: w.y + cy * hr, vx: cx * SHOT_SPEED, vy: cy * SHOT_SPEED, type: w.weapon, owner: w, life: SHOT_LIFE });
  addFx(w.x + cx * hr, w.y + cy * hr, w.weapon, 0.45);
  w.ammo--; w.fireCd = 0.35;
  if (w.ammo <= 0) w.weapon = null;
  if (w.isPlayer) vibrate(25);
  return true;
}
function applyPush(o, ux, uy) {
  o.pvx = ux * 520; o.pvy = uy * 520; o.pushT = 0.6;
  o.angle = Math.atan2(uy, ux); o.targetAngle = o.angle; o.boosting = false;
}
function shotHit(s, o) {
  const by = s.owner, name = by ? by.name : '?';
  addFx(s.x, s.y, s.type, 1);
  if (o.shield > 0) {
    o.shield--;
    tell(o, { e: 'blocked', n: name }); if (by) tell(by, { e: 'hitBlocked', n: o.name });
    return;
  }
  if (s.type === 'stun') {
    o.stunT = STUN_TIME; o.boosting = false; o.pushT = 0;
    tell(o, { e: 'stunned', n: name }); if (by) tell(by, { e: 'hitStun', n: o.name });
  } else {
    let ux = o.x - (by ? by.x : s.x - s.vx), uy = o.y - (by ? by.y : s.y - s.vy); const d = Math.hypot(ux, uy) || 1; ux /= d; uy /= d;
    if (o.remote) tell(o, { e: 'pushed', n: name, ux: r3(ux), uy: r3(uy) }); // the guest's phone moves its own worm
    else { applyPush(o, ux, uy); tell(o, { e: 'pushed', n: name }); }
    o.fleeX = by ? by.x : s.x; o.fleeY = by ? by.y : s.y; o.fleeT = 6;
    if (by) tell(by, { e: 'hitRepel', n: o.name });
  }
}
function moveShots(dt) {
  for (let i = W.shots.length - 1; i >= 0; i--) {
    const s = W.shots[i]; s.life -= dt;
    const n = Math.max(1, Math.ceil(SHOT_SPEED * dt / 8)); let hit = null, gone = false;
    for (let k = 0; k < n && !hit && !gone; k++) {
      s.x += s.vx * dt / n; s.y += s.vy * dt / n;
      for (const m of W.meteors) if (dist2(s.x, s.y, m.x, m.y) < (m.rock + 3) ** 2) { gone = true; addFx(s.x, s.y, s.type, 0.6); break; }
      if (gone) break;
      for (const o of W.worms) { if (o === s.owner || !o.alive || o.invuln > 0) continue; const rr = rOf(o) * 1.3 + 5; if (dist2(s.x, s.y, o.x, o.y) < rr * rr) { hit = o; break; } }
      if (!hit) segGrid.pairs(s.x, s.y, 24, (o, j) => { if (o === s.owner || !o.alive || o.invuln > 0) return; const p = o.pts[j]; if (!p) return; const rr = rOf(o) + 5; if (dist2(s.x, s.y, p.x, p.y) < rr * rr) { hit = o; return false; } });
    }
    if (hit) { shotHit(s, hit); W.shots.splice(i, 1); }
    else if (gone || s.life <= 0 || s.x * s.x + s.y * s.y > ARENA_R * ARENA_R) W.shots.splice(i, 1);
  }
}

function teleport(w) {
  const p = safeSpot(120, null), dx = p.x - w.x, dy = p.y - w.y;
  w.x += dx; w.y += dy; for (const q of w.pts) { q.x += dx; q.y += dy; }
  const lost = Math.floor(w.score * 0.1); w.score = Math.max(10, w.score - lost); w.invuln = Math.max(w.invuln, 1.2);
  if (NET.mode === 'host') netTeleported(w);
  tell(w, { e: 'hole', l: lost, x: Math.round(w.x), y: Math.round(w.y) });
}

function useShield(w) {
  if (w.shield <= 0) return false;
  w.shield--; w.invuln = 1.5; w.angle += Math.PI; w.targetAngle = w.angle;
  tell(w, { e: 'shield' });
  return true;
}
// The bigger worm wins a touch. Biting the head eats the whole worm; biting the body cuts off
// everything behind the bite (it turns into energy) and the part towards the head lives on.
function eatWorm(a, b, idx) {
  if ((a.biteCd || 0) > W.t) return;
  const headZone = Math.max(3, Math.ceil(rOf(b) * 2.6 / spacingOf(b)));
  if (idx <= headZone) {
    if (useShield(b)) { tell(a, { e: 'saved', n: b.name }); return; }
    tell(a, { e: 'eat', n: b.name });
    killWorm(b, (b.isPlayer || b.remote) ? 'eaten' : 'worm', a, 0.85);
    return;
  }
  a.biteCd = W.t + 0.35;
  const removed = b.pts.splice(idx);
  const lost = Math.max(1, Math.floor(b.score * removed.length / (removed.length + b.pts.length)));
  dropBody({ pts: removed, score: lost, band: b.band, base: b.base }, 0.8);
  b.score -= lost;
  if (NET.mode === 'host') for (const c of NET.clients.values()) c.bodies.delete(b.id);
  tell(a, { e: 'bite', n: b.name, l: lost });
  tell(b, { e: 'bitten', n: a.name, l: lost });
  if (b.score < 10) killWorm(b, (b.isPlayer || b.remote) ? 'eaten' : 'worm', a, 0.85);
}

function collide(w) {
  if (!w.alive) return;
  const r = rOf(w), hr = r * 1.1;
  if (w.x * w.x + w.y * w.y > (ARENA_R - r) ** 2) { killWorm(w, 'edge', null); return; }
  for (const h of W.holes) if (dist2(w.x, w.y, h.x, h.y) < (h.core + r * 0.4) ** 2) { teleport(w); return; }
  for (const b of W.bodies) {
    if (!b.alive || dist2(w.x, w.y, b.x, b.y) > ((b.r + r * 1.3) * (w.magnet2T > 0 ? 2 : 1)) ** 2) continue;
    if (w.score >= b.need) {
      b.alive = false; b.back = W.t + 25;
      if (b.type === 'moon') { w.moons++; w.magnetT = Math.max(0, w.magnetT) + 30; grow(w, 15); tell(w, { e: 'moon' }); }
      else { w.planets++; w.shield = Math.min(3, w.shield + 1); grow(w, 30); tell(w, { e: 'planet' }); }
    } else if ((w.isPlayer || w.remote) && W.t - (w.hintAt ?? -9) > 3) { w.hintAt = W.t; tell(w, { e: 'small', n: b.need }); }
  }
  for (const p of W.pickups) if (p.alive && dist2(w.x, w.y, p.x, p.y) < (PK_R + r * 1.3 + 4) ** 2 && canTake(w, p)) takePickup(w, p);
  if (w.invuln > 0) return;
  for (const m of W.meteors) {
    if (dist2(w.x, w.y, m.x, m.y) < (m.rock + hr) ** 2) {
      if (useShield(w)) return;
      killWorm(w, 'meteor', null); return;
    }
  }
  let hit = null;
  segGrid.pairs(w.x, w.y, hr + 30, (o, i) => {
    if (o === w || !o.alive || o.invuln > 0) return;
    const head = i < 0, p = head ? o : o.pts[i]; if (!p) return;
    // heads touch as soon as the drawn heads touch; bodies a little later
    const rr = head ? (r + rOf(o)) * 1.3 * 0.92 : hr + rOf(o) * 0.95;
    if (dist2(w.x, w.y, p.x, p.y) < rr * rr) { hit = { o, i }; return false; }
  });
  if (hit) {
    if (w.score > hit.o.score) eatWorm(w, hit.o, hit.i);
    else if (!useShield(w)) killWorm(w, 'worm', hit.o);
  }
}

/* ---------------- Bots ---------------- */
const RAY_STEPS = [[0.12, 1.6], [0.34, 1.1], [0.67, 0.7], [1, 0.4]];
function rayDanger(b, a, L) {
  const r = rOf(b), cx = Math.cos(a), cy = Math.sin(a); let danger = 0;
  for (const [f, wt] of RAY_STEPS) {
    const d = Math.max(r * 2.6, L * f), x = b.x + cx * d, y = b.y + cy * d;
    if (x * x + y * y > (ARENA_R - 80) ** 2) danger += 1.4 * wt;
    for (const m of W.meteors) { if (dist2(x, y, m.x, m.y) < (m.rock + r * 2 + 24) ** 2) danger += 1.2 * wt; else if (dist2(x, y, m.ax, m.ay) < m.ring * m.ring) danger += 0.3 * wt; }
    for (const h of W.holes) if (dist2(x, y, h.x, h.y) < (h.core + 50) ** 2) danger += 0.6 * wt;
    let hits = 0;
    segGrid.pairs(x, y, r * 2 + 14, (o, i) => {
      if (o === b || !o.alive) return;
      const p = i < 0 ? o : o.pts[i]; if (!p) return;
      if (o.score >= b.score && dist2(x, y, p.x, p.y) < (r * 1.3 + rOf(o) + 8) ** 2) { hits++; if (hits > 2) return false; }
    });
    danger += Math.min(hits, 2) * 0.9 * wt;
  }
  return danger;
}
function botGoal(b) {
  const r = rOf(b); b.wantBoost = false;
  const dc = Math.hypot(b.x, b.y);
  if (dc > ARENA_R * 0.82) return Math.atan2(-b.y, -b.x);
  for (const h of W.holes) { const d2 = dist2(b.x, b.y, h.x, h.y); if (d2 < (h.R * 0.8) ** 2) return Math.atan2(b.y - h.y, b.x - h.x); }
  // driven off by a repeller: keep away from whoever fired it
  if (b.fleeT > 0) return Math.atan2(b.y - b.fleeY, b.x - b.fleeX);
  if (b.hunter && b.score > 40) {
    let prey = null, best = diffCfg().huntR ** 2;
    for (const o of W.worms) { if (o === b || !o.alive || o.score * 1.3 > b.score || o.score < 20 || o.invuln > 0) continue; const d2 = dist2(b.x, b.y, o.x, o.y); if (d2 < best) { best = d2; prey = o; } }
    if (prey) { const lead = 40 + rOf(prey) * 4; if (best < 170 * 170 && Math.random() < diffCfg().boostP) b.wantBoost = true; return Math.atan2(prey.y + Math.sin(prey.angle) * lead - b.y, prey.x + Math.cos(prey.angle) * lead - b.x); }
  }
  for (const c of W.bodies) if (c.alive && b.score >= c.need && dist2(b.x, b.y, c.x, c.y) < 420 * 420) return Math.atan2(c.y - b.y, c.x - b.x);
  for (const p of W.pickups) if (p.alive && canTake(b, p) && dist2(b.x, b.y, p.x, p.y) < 300 * 300) return Math.atan2(p.y - b.y, p.x - b.x);
  let tgt = null, bestS = 0;
  foodGrid.each(b.x, b.y, 230, f => { if (!f.alive) return; const d = Math.sqrt(dist2(b.x, b.y, f.x, f.y)); const s = f.v / (d + 30); if (s > bestS) { bestS = s; tgt = f; } });
  if (tgt) return Math.atan2(tgt.y - b.y, tgt.x - b.x);
  b.wander += rand(-0.6, 0.6); return b.wander;
}
function botThink(b) {
  const r = rOf(b), look = (70 + r * 7 + speedOf(b) * 0.35) * diffCfg().look;
  const goal = botGoal(b);
  let best = b.angle, bestS = -1e9;
  for (const da of [0, -0.4, 0.4, -0.85, 0.85, -1.4, 1.4, -2.1, 2.1]) {
    const a = b.angle + da, dg = rayDanger(b, a, look);
    const s = -dg * 8 + Math.cos(angDiff(goal, a)) - Math.abs(da) * 0.1;
    if (s > bestS) { bestS = s; best = a; }
  }
  b.targetAngle = best;
  b.boosting = b.wantBoost && b.score > 45 && bestS > -2;
}

  if (NET.mode === 'host') { for (const c of NET.clients.values()) c.meta.delete(player.id); }
  else if (NET.mode === 'client' && NET.mq) NET.mq.pub(T(`r/${NET.room}/in/${NET.cid}`), JSON.stringify({ t: 'look', name, base: sk.base, band: sk.band, stars: sk.stars ? 1 : 0 }));
}
$('tabAll').addEventListener('click', () => { skinTab = 'all'; buildSkins(); });
$('tabOwned').addEventListener('click', () => { skinTab = 'owned'; buildSkins(); });

/* game flow */
let wakeLock = null;
function startGame() {
  newWorld(true);
  beginPlay();
}
function beginPlay() {
  for (const s of screens) $(s).hidden = true;
  $('over').hidden = true; $('pause').hidden = true; $('msg').hidden = true;
  Object.assign(run, { time: 0, combo: 0, lastEat: -9, maxCombo: 0, gains: [], crownTime: 0, leader: null, crownNoticeAt: -9, reason: null, killer: '', hintAt: -9, boostHintAt: -9 });
  cam.x = player.x; cam.y = player.y; cam.z = 1; cam.follow = player;
  notices.innerHTML = ''; biteEl.hidden = true; lastBoard = ''; lastChips = ''; lastFire = '-'; fireBtn.classList.remove('fresh');
  $('hud').hidden = false; state = 'play'; updateBoard(); updateHud();
  if (coarse || input.touchSeen) joyEl.hidden = false;
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { wakeLock = l; }).catch(() => {}); } catch (e) { /* ignore */ }
}
// Fills the pause card with the current settings.
function prepPause() {
  const online = NET.mode !== 'solo';
  $('pauseNote').hidden = !online; $('pauseBots').hidden = false;
  $('pauseName').value = save.name; buildSpeeds(); syncSwitches(); refreshBotsUI();
  $('pause').scrollTop = 0;
}
function togglePause() {
  // Online the world never stops: the menu just opens on top while the room keeps playing.
  if (NET.mode !== 'solo') {
    const opening = $('pause').hidden; $('pause').hidden = !opening;
    if (opening) { prepPause(); input.boostBtn = false; input.joyActive = false; joyRest(); } else applyLook();
    return;
  }
  if (state === 'play') { prepPause(); state = 'pause'; $('pause').hidden = false; input.boostBtn = false; input.joyActive = false; joyRest(); }
  else if (state === 'pause') { state = 'play'; $('pause').hidden = true; applyLook(); }
}
$('pauseBtn').addEventListener('click', togglePause);
$('resumeBtn').addEventListener('click', () => { if (NET.mode !== 'solo') { $('pause').hidden = true; applyLook(); } else togglePause(); });
$('pauseSkinsBtn').addEventListener('click', () => { skinsReturn = 'pause'; $('pause').hidden = true; for (const sc of screens) $(sc).hidden = sc !== 'skins'; buildSkins(); });
$('quitBtn').addEventListener('click', () => { $('pause').hidden = true; toMenu(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && NET.mode === 'solo') togglePause(); });
function toMenu() { netLeave(); state = 'menu'; $('hud').hidden = true; $('over').hidden = true; $('msg').hidden = true; $('pause').hidden = true; player = null; newWorld(false); cam.follow = null; showScreen('menu'); try { wakeLock && wakeLock.release(); } catch (e) { /* ignore */ } }
function showGameOver() {
  if (state !== 'dead') return;
  state = 'over';
  if (skinsReturn === 'pause') { $('skins').hidden = true; skinsReturn = 'menu'; }
  $('pause').hidden = true;
  const p = player, maxLen = Math.floor(p.maxScore);
  const dust = Math.floor(maxLen / 8) + p.kills * 15 + Math.floor(run.crownTime) + Math.floor(run.maxCombo / 5);
  const isRec = maxLen > save.record;
  save.dust += dust; if (isRec) save.record = maxLen; persist();
  const R = run.reason, who = run.killer || '?';
  $('overReason').textContent = R === 'meteor' ? t('deathMeteor') : R === 'edge' ? t('deathEdge') : R === 'eaten' ? t('deathEaten', { name: who }) : t('deathWorm', { name: who });
  $('overTip').textContent = R === 'meteor' ? t('tipMeteor') : R === 'edge' ? t('tipEdge') : R === 'eaten' ? t('tipEaten') : t('tipWorm');
  $('overLen').textContent = fmt(maxLen); $('overRec').hidden = !isRec;
  $('overKills').textContent = fmt(p.kills); $('overBodies').textContent = fmt(p.moons + p.planets);
  const sec = Math.floor(run.time); $('overTime').textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  $('overDust').textContent = '+' + fmt(dust);
  $('overMoons').textContent = t('moons', { n: p.moons }); $('overPlanets').textContent = t('planets', { n: p.planets });
  $('hud').hidden = true; $('over').hidden = false;
}
$('againBtn').addEventListener('click', () => { if (NET.mode === 'solo') startGame(); else netRespawn(); });
$('msgBtn').addEventListener('click', toMenu);
$('onlineBtn').addEventListener('click', () => { setNetStatus(''); showScreen('online'); refreshBotsUI(); });
// Bot count steppers: on the online screen (for a room you host) and in the pause menu (the room right now).
const BOT_STEPS = [0, 2, 5, 10, 15, 20, 25, 30, 40, 50];
function nextBots(cur, dir) {
  if (dir > 0) { for (const v of BOT_STEPS) if (v > cur) return v; return BOT_STEPS[BOT_STEPS.length - 1]; }
  for (let i = BOT_STEPS.length - 1; i >= 0; i--) if (BOT_STEPS[i] < cur) return BOT_STEPS[i];
  return 0;
}
function refreshBotsUI() {
  const ids = { online: 'botsOnline', room: 'botsRoom', solo: 'botsSolo' };
  const set = (scope, v) => { $(ids[scope]).textContent = v; document.querySelectorAll('[data-bots="' + scope + '"]').forEach(b => { b.disabled = +b.dataset.dir < 0 ? v <= 0 : v >= 50; }); };
  const solo = NET.mode === 'solo';
  set('online', save.netBots ?? 20); set('solo', soloBots()); set('room', solo ? soloBots() : NET.bots);
  // the pause menu's row is the room's count online and your own count alone
  $('pauseBotsLbl').textContent = t(solo ? 'botsSoloLbl' : 'botsLbl'); $('pauseBotsNote').hidden = solo;
}
document.querySelectorAll('[data-bots]').forEach(b => b.addEventListener('click', () => {
  const dir = +b.dataset.dir;
  if (b.dataset.bots === 'online') { save.netBots = nextBots(save.netBots ?? 20, dir); persist(); refreshBotsUI(); return; }
  if (b.dataset.bots === 'solo' || NET.mode === 'solo') { save.soloBots = nextBots(soloBots(), dir); persist(); refreshBotsUI(); return; }
  const n = nextBots(NET.bots, dir); save.netBots = n; persist();
  if (NET.mode === 'host') hostSetBots(n, NET.cid, save.name.trim() || t('you'));
  else if (NET.mode === 'client' && NET.mq) { NET.bots = n; NET.botsHold = performance.now() + 2000; NET.mq.pub(T(`r/${NET.room}/in/${NET.cid}`), JSON.stringify({ t: 'bots', n })); refreshBotsUI(); }
}));
$('quickBtn').addEventListener('click', netQuick);
$('createBtn').addEventListener('click', netCreate);
$('joinCodeBtn').addEventListener('click', () => netJoinCode($('codeInput').value));
// Your room code stays the same until you change it.
if (!validCode(save.roomCode)) { save.roomCode = rid(4); persist(); }
$('myCodeInput').value = save.roomCode; $('codeInput').value = save.lastCode || '';
$('myCodeInput').addEventListener('input', e => { const v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); e.target.value = v; if (validCode(v)) { save.roomCode = v; persist(); } });
$('myCodeInput').addEventListener('blur', e => { e.target.value = save.roomCode; });
$('newCodeBtn').addEventListener('click', () => { save.roomCode = rid(4); persist(); $('myCodeInput').value = save.roomCode; });
$('codeInput').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); });
$('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') netJoinCode(e.target.value); });
$('overMenu').addEventListener('click', toMenu);
$('overSkins').addEventListener('click', () => { skinsReturn = 'over'; $('over').hidden = true; for (const s of screens) $(s).hidden = s !== 'skins'; buildSkins(); });

/* ---------------- Loop ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state !== 'pause') step(dt);
  render(now / 1000);
  requestAnimationFrame(frame);
}
resize(); makePatterns(); newWorld(false); applyI18n(); showScreen('menu');
// Android back button (used by the app wrapper): returns true when the game handled it.
window.__androidBack = () => {
  if (!$('msg').hidden) { toMenu(); return true; }
  const open = ['skins', 'settings', 'online'].find(id => !$(id).hidden);
  if (open && (state === 'menu' || state === 'over' || skinsReturn === 'pause')) { $(open).querySelector('[data-back]').click(); return true; }
  if (state === 'play' || state === 'pause') { togglePause(); return true; }
  if (state === 'over' || state === 'dead') { toMenu(); return true; }
  return false;
};
window.__game = { get net() { return NET; }, killWorm, get state() { return state; }, get player() { return player; }, get world() { return W; }, startGame, killPlayer: r => player && killWorm(player, r || 'meteor', null), fire, shoot, takePickup, diffCfg };
requestAnimationFrame(frame);
})();
